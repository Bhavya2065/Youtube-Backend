$kind: http-request
name: Update Video
method: PATCH
url: '{{videos}}/update-video/:id'
order: 3000
description: 'Update video details. At least one field required. Requires auth.'
pathVariables:
  - key: id
    value: ''
body:
  type: formdata
  content:
    - key: thumbnail
      type: file
      src: ''
    - key: title
      type: text
      value: ''
    - key: description
      type: text
      value: ''
    - key: isPublished
      type: text
      value: ''
